<!doctype html>
<html lang="id">
	<head>
		<meta charset="UTF-8" />
		<title>Dataset Aksara Jawa</title>
		<style>
			@font-face {
				font-family: "AksaraJawa";
				src: url("./nyk Ngayogyan Jejeg.ttf") format("truetype");
			}

			:root {
				--bg: #f6f7f9;
				--panel: #ffffff;
				--border: #dcdfe4;
				--header: #f0f2f5;
				--hover: #e8f0fe;
				--text: #1f2937;
			}

			* {
				box-sizing: border-box;
			}

			body {
				margin: 0;
				padding: 16px 20px;
				font-family:
					system-ui,
					-apple-system,
					Segoe UI,
					Roboto,
					Arial,
					sans-serif;
				background: var(--bg);
				color: var(--text);
			}

			h1 {
				margin: 0 0 12px;
				text-align: center;
				font-size: 20px;
				font-weight: 600;
			}

			/* Selector */
			select {
				display: block;
				margin: 0 auto 12px;
				padding: 6px 14px;
				font-size: 14px;
				border-radius: 6px;
				border: 1px solid var(--border);
				background: var(--panel);
				cursor: pointer;
			}

			/* Wrapper */
			.tableWrap {
				height: calc(100vh - 120px);
				overflow: auto;
				background: var(--panel);
				border-radius: 10px;
				border: 1px solid var(--border);
				box-shadow: 0 2px 6px rgba(0, 0, 0, 0.05);
			}

			/* Table */
			table {
				width: 100%;
				border-collapse: collapse;
				table-layout: fixed;
			}

			/* Header */
			thead th {
				position: sticky;
				top: 0;
				z-index: 10;
				background: var(--header);
				border-bottom: 2px solid var(--border);
				font-size: 13px;
				font-weight: 600;
				padding: 8px;
			}

			/* Cells */
			th,
			td {
				border-bottom: 1px solid var(--border);
				padding: 6px 8px;
				text-align: center;
				vertical-align: middle;
				font-size: 13px;
			}

			/* Zebra rows */
			tbody tr:nth-child(even) {
				background: #fafafa;
			}

			tbody tr:hover {
				background: var(--hover);
			}

			/* Column sizing */
			th:nth-child(1),
			td:nth-child(1) {
				width: 48px;
				font-weight: 600;
				color: #555;
			}

			th:nth-child(2),
			td:nth-child(2) {
				width: 110px;
				font-family: monospace;
				font-size: 12px;
			}

			th:nth-child(3),
			td:nth-child(3) {
				width: auto;
			}

			th:nth-child(4),
			td:nth-child(4) {
				width: 180px;
				font-size: 12px;
				text-align: left;
				padding-left: 12px;
			}

			/* Aksara */
			.aksara {
				font-family: "AksaraJawa";
				font-size: 64px;
				line-height: 1.2;
				white-space: nowrap;
			}
		</style>
	</head>
	<body>
		<h1>Dataset Aksara Jawa</h1>

		<select id="csvSelect"></select>

		<div class="tableWrap">
			<table id="dataTable">
				<thead>
					<tr>
						<th>No.</th>
						<th>ID Gambar</th>
						<th>Aksara Jawa</th>
						<th>Transliterasi</th>
					</tr>
				</thead>
				<tbody>
					<!-- Data akan masuk di sini -->
				</tbody>
			</table>
		</div>

		<script>
			const csvSelect = document.getElementById("csvSelect");
			const tableBody = document.querySelector("#dataTable tbody");

			const LABEL_COUNT = 10;

			// Buat option otomatis
			for (let i = 1; i <= LABEL_COUNT; i++) {
				const opt = document.createElement("option");
				opt.value = `label_${i}.csv`;
				opt.textContent = `Label ${i}`;
				csvSelect.appendChild(opt);
			}

			// Restore pilihan terakhir
			const savedCSV = localStorage.getItem("selectedCSV");
			if (savedCSV) {
				csvSelect.value = savedCSV;
			}

			async function loadCSV(filename) {
				tableBody.innerHTML = "";
				try {
					const response = await fetch(filename);
					if (!response.ok) {
						console.warn(`Gagal load ${filename}: ${response.status}`);
						return;
					}
					const text = await response.text();
					parseCSV(text);
				} catch (err) {
					console.error(`Error load ${filename}:`, err);
				}
			}

			function parseCSV(text) {
				const lines = text.trim().split("\n");
				for (let i = 1; i < lines.length; i++) {
					const row = lines[i].split(",");

					const tr = document.createElement("tr");

					const indexTd = document.createElement("td");
					indexTd.textContent = i;

					const idTd = document.createElement("td");
					idTd.textContent = row[0]?.split("_")[2]?.split(".")[0] || row[0];

					const aksaraTd = document.createElement("td");
					aksaraTd.classList.add("aksara");
					aksaraTd.textContent = row[1];

					const translitTd = document.createElement("td");
					translitTd.textContent = row[2];

					tr.append(indexTd, idTd, aksaraTd, translitTd);
					tableBody.appendChild(tr);
				}
			}

			csvSelect.addEventListener("change", () => {
				localStorage.setItem("selectedCSV", csvSelect.value);
				loadCSV(csvSelect.value);
			});
			window.addEventListener("DOMContentLoaded", () => {
				loadCSV(csvSelect.value);
			});
		</script>
	</body>
</html>
